[package]
name = "hon-dishwasher"
version = "0.1.0"
edition = "2024"
description = "Control nativo (Rune) para un lavavajillas Candy CF 6C4F1PS-12 vía hOn"

[dependencies]
rune = { path = "vendor/rune/crates/rune" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los mismos patches que declara el workspace de Rune (los volcados también los
# replican las apps que dependen de Rune, según vendor/rune/AGENTS.md).
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
