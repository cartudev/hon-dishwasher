name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install linking dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Clone Rune at the pinned dev rev
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/anomalyco/rune.git vendor/rune
          git -C vendor/rune fetch --depth 1 origin $(cat packaging/RUNE_REV)
          git -C vendor/rune checkout $(cat packaging/RUNE_REV)

      - name: Apply the Wayland patches
        run: git -C vendor/rune apply "$GITHUB_WORKSPACE/patches/winit-request-inner-size.patch"

      - name: Build (release)
        run: cargo build --release

      - name: Package
        run: |
          dir="hon-dishwasher-linux"
          mkdir -p "dist/${dir}"
          cp target/release/hon-dishwasher "dist/${dir}/"
          cp -r src config "dist/${dir}/"
          cp requirements.txt packaging/install.sh "dist/${dir}/"
          cp README.md LICENSE "dist/${dir}/"
          tar -C dist -czf "dist/hon-dishwasher-linux-x86_64.tar.gz" "${dir}"
          echo "file=dist/hon-dishwasher-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/}"
          gh release create "$version" "$file" \
            --title "hon-dishwasher $version" \
            --notes "Linux x86_64 build (glibc of ubuntu 24.04). Unpack, run
            \`./install.sh\` (Python environment + autostart service), then fill in
            your hOn credentials from the tray icon's Settings. The first query
            takes ~30 s; after that the widget lists from its cache instantly." \
            --verify-tag

  windows:
    needs: linux
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Clone Rune at the pinned dev rev
        shell: bash
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/anomalyco/rune.git vendor/rune
          git -C vendor/rune fetch --depth 1 origin $(cat packaging/RUNE_REV)
          git -C vendor/rune checkout $(cat packaging/RUNE_REV)

      - name: Build (release, tray-only backend packaging)
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          dir="hon-dishwasher-windows"
          mkdir -p "dist/${dir}"
          cp target/release/hon-dishwasher.exe "dist/${dir}/"
          cp -r src config "dist/${dir}/"
          cp requirements.txt run.bat packaging/start-widget.bat "dist/${dir}/"
          cp README.md LICENSE "dist/${dir}/"
          cd dist && 7z a "hon-dishwasher-windows-x86_64.zip" "${dir}" && cd ..
          echo "file=dist/hon-dishwasher-windows-x86_64.zip" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/}"
          gh release upload "$version" "$file" --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash
